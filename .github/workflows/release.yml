name: Publish release APK

# Runs when you push a version tag such as v1.0.0. It builds a SIGNED release APK, checks it, and attaches it to
# a public GitHub Release. The signing key comes from encrypted repository secrets and is never in the code.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the release and attach the APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "versionName = \"$VERSION\"" app/build.gradle.kts; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName in app/build.gradle.kts. Update versionName first."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches versionName $VERSION"

      - name: Prepare the signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is missing. See docs/RELEASING.md."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Verify the APK (file, signature, package id, version)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -s "$APK" ]; then echo "::error::The release APK is missing or empty."; exit 1; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signature.txt \
            || { echo "::error::The APK is not signed."; exit 1; }
          "$BT/aapt2" dump badging "$APK" > badging.txt
          head -1 badging.txt
          grep -q "package: name='com.aggreykibe.dayflow'" badging.txt \
            || { echo "::error::Unexpected application id."; exit 1; }
          grep -q "versionName='${GITHUB_REF_NAME#v}'" badging.txt \
            || { echo "::error::The APK versionName does not match the tag."; exit 1; }
          if grep -q "application-debuggable" badging.txt; then echo "::error::This is a debuggable build."; exit 1; fi
          echo "APK size: $(stat -c%s "$APK") bytes"

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk AggreyDayFlow.apk
          sha256sum AggreyDayFlow.apk > AggreyDayFlow.apk.sha256
          CERT=$(grep -m1 "certificate SHA-256 digest" signature.txt | sed 's/.*: //')
          SUM=$(cut -d' ' -f1 AggreyDayFlow.apk.sha256)
          {
            echo "Aggrey DayFlow $GITHUB_REF_NAME (beta): an offline reminder and alarm app for Android."
            echo
            echo "How to install"
            echo "1. Download AggreyDayFlow.apk below, on your Android phone."
            echo "2. Open the file. If Android says it is blocked, allow Install unknown apps for the app you opened it from, then open the file again."
            echo "3. If Google Play Protect warns about an unknown app, choose More details, then Install anyway. This app is shared directly, not through the Play Store."
            echo "4. Open Aggrey DayFlow and allow notifications. In Settings inside the app, check the permission status."
            echo
            echo "Beta notice: alarm behaviour is still being tested on real phones in every state (locked, restarted, battery saver). See docs/ALARM_TESTING.md and docs/STATUS.md in the repository for what has and has not been verified."
            echo
            echo "Verify your download"
            echo "- File SHA-256: $SUM"
            echo "- Signing certificate SHA-256: $CERT"
            echo "Updates signed with the same certificate install over this version without losing reminders."
          } > release-notes.md
          cat release-notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" AggreyDayFlow.apk AggreyDayFlow.apk.sha256 \
            --title "Aggrey DayFlow $GITHUB_REF_NAME" \
            --notes-file release-notes.md
